# default.ini - tunable values. Press F5 in the game to reload. Missing or malformed values fall back to the defaults in code.

[window]
width = 1600        # UNITS: physical pixels (client area)
height = 900

[render]
town_atmosphere = true    # TUNE: false restores the old backdrop and fog; press F5 for comparison
vsync = true
adapter = -1        # -1 = the first hardware GPU in "high performance" order; N = the N-th adapter listed in the log
clear_r = 0.010     # linear colour (the back buffer is written through an sRGB view)
clear_g = 0.015
clear_b = 0.040

[log]
level = info        # trace | info | warn | error

[camera]
move_speed = 3.0    # UNITS: metres per second. TUNE: try 1 and 10
turn_speed = 1.5    # UNITS: radians per second (1.5 is about 86 degrees per second)
orbit_distance = 3.8       # UNITS: metres; shorter in narrow streets automatically
land_dip = 0.012           # UNITS: metres of eye dip per m/s of landing speed. TUNE: 0 = off
land_dip_max = 0.15        # UNITS: metres
fov_deg = 70               # UNITS: degrees, vertical (about 102 across a 16:9 screen). TUNE: 60 .. 90


# the feel of the walking body (Player.h); a key that is left out keeps the built-in value
[player]
# Town prototype only. Changes to these controls are read on F5.
third_person = true
sprint = true
sprint_multiplier = 1.6
mantle = true
mantle_height = 2.2
ground_accel = 95          # UNITS: m/s^2 to the walking speed. TUNE: 40 feels heavy, 120 feels instant
ground_decel = 120          # UNITS: m/s^2 when the keys are let go
air_accel = 40             # UNITS: m/s^2 of steering in the air. TUNE: 10 commits a jump, 70 steers like the ground
fall_gravity_scale = 1.6   # gravity while falling = gravity * this. TUNE: 1 floats, 2.2 drops hard
jump_cut = 0.45            # the part of the rise kept when Space is let go early. TUNE: 1 = no small hop

[mouse]
sensitivity = 0.0022       # UNITS: radians per count of the mouse. TUNE: 0.001 slow, 0.004 fast
invert_y = false

[guidance]
enabled = true             # the flame of the lantern leans toward the next thing to do; H asks for more
lean_degrees = 18          # UNITS: degrees the flame leans toward the goal. TUNE: 0 = upright, 30 is plain to see
lean_idle_degrees = 40     # UNITS: degrees after idle_seconds without progress, with sparks
idle_seconds = 30          # UNITS: seconds without progress before the flame is restless. TUNE: 20 helps sooner, 60 later
sweep_seconds = 6          # UNITS: seconds the lantern stays raised, with its beam, after the first press of H
ghost_after_seconds = 90   # UNITS: seconds without progress before the second press of H shows the thing to use
ghost_seconds = 12         # UNITS: seconds the thing stays shown

[map]
reveal_radius = 15         # UNITS: metres round the body that the map shows (M). TUNE: 8 shows little, 30 a lot
[lighting]
# The light of the town (docs/DESIGN.md 6.3): the shadows of the sun and the moon, the lamps, the exposure. F5 reloads it. In the game the key
# L looks at the light in parts: everything, no shadows, no lamps, only the shadow of the sun, only the lamps.
shadows = true             # a shadow map of the sun (A) and the moon (B). TUNE: false switches them off (and shows what they cost)
shadow_size = 2048         # UNITS: texels along a side of the map: 512 .. 4096, a power of two. TUNE: 1024 on a slow GPU, 4096 for sharper edges
shadow_radius = 60         # UNITS: metres: the map covers this far round the camera. TUNE: 30 sharper and nearer, 120 farther and softer
shadow_strength = 0.85     # 0 .. 1: how much of the direct light a shadow takes (the sky light stays). TUNE: 1 black shadows, 0.5 pale
shadow_bias = 3.0          # UNITS: texels: the depth bias. TUNE: more if the surfaces are speckled (acne), less if shadows float off their objects
shadow_normal = 1.5        # UNITS: texels: a surface is moved this far along its normal before the lookup. TUNE: as the bias
point_lights = true        # the lamps of the streets and the lantern light what is near them
lamps_a = 0.55             # the street lamps in A (the evening: the sun is still up). TUNE: 1 as in B
lamps_b = 1.0              # the street lamps in B (the present: the only light but the moon). TUNE: 2 for a brighter night
lantern = 1.0              # the lantern of the traveller, the lit lamps of the mast and the lamps over the ropes of the bells
sun_a = 1.0                # the light of the sun of A (1 = as the model says)
sun_b = 0.8                # the light of the moon of B. TUNE: 1 as the model says (brighter, flatter), 0.6 for a darker night
ambient_a = 1.0            # the sky light of A
ambient_b = 0.9            # the sky light of B
sun_scatter = 0.25         # the haze glows toward the sun. TUNE: 0 off, 0.6 strong
exposure = 1.0             # the light is multiplied by this before the soft shoulder. TUNE: 1.2 brighter, 0.8 darker
knee = 0.78                # 0.3 .. 0.98: a colour brighter than this is bent toward white instead of cut off. TUNE: 0.98 nearly cut, 0.5 very soft
halos = true               # a soft glow round the lit lamps
halo_a = 0.35              # its strength in A (the sun hides a lamp)
halo_b = 1.0               # its strength in B

# The style of the light (docs/DESIGN.md 6.3): hand-painted rather than photographic. In the game the key L ends its round with "plain": the
# same light without any of this, to compare. Every amount is 0 .. 1 (0 = off) unless said.
style = 1.0                # the master of all of it. TUNE: 0 is the plain light, 0.5 half of every effect below
toon = 0.6                 # the sun falls on a face in three soft bands instead of a smooth slope
cool = 0.75                # the sky light of a face the sun does not reach leans to a cool colour (blue-violet in A, indigo in B)
rim = 0.28                 # 0 .. 2: the rim of an edge that faces the light (the stone of the city has a third of it)
clouds_a = 0.38            # 0 .. 0.9: the part of the sun that a drifting cloud takes in A. TUNE: 0 = no cloud shadows
clouds_b = 0.28            # ... and in B
lamp_rings = 0.6           # the pool of a lamp in four soft rings, a whiter core and an amber edge
shafts = true              # rays of light in the air (they need shadows = true)
shafts_a = 0.55            # 0 .. 3: their strength in A. TUNE: 1 for plain rays, 0.2 for a trace
shafts_b = 0.40            # ... and in B
shaft_steps = 14           # 4 .. 32: samples along a ray of sight. TUNE: 8 on a slow GPU (the rays grain), 24 for the smoothest
wash = 0.9                 # the painted blotches of the stone (value and hue; tall stains on walls). TUNE: 0 = flat stone
damp = 0.5                 # the stone near the water darker and cooler (B has twice as much as A)
haze = 0.6                 # the far haze leans to lavender in A and to teal in B
grade = 1.0                # the darks and the lights of the picture lean to the colours of the look (A: blue-violet and gold, B: indigo and pale cyan)
saturation = 1.0           # 0 .. 2: how much of the colour push of the look is used (0: none)
contrast = 1.0             # 0 .. 2: how much of the contrast of the look is used (0: none; more: deeper darks and lighter lights)
vignette = 1.0             # 0 .. 2: how much of the dark corner of the look is used
